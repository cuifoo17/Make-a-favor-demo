<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do Favor</title>
<style>
  :root{--green:#4a9b3a;--ink:#111;--muted:#666;--bg:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10;padding-top:env(safe-area-inset-top)}
  header img{height:56px;width:auto;display:block}
  .step{position:absolute;inset:0;padding:100px 20px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;transform:translateY(40px);pointer-events:none;transition:opacity .35s ease,transform .35s ease}
  .step.active{opacity:1;transform:none;pointer-events:auto}
  .step.leaving{opacity:0;transform:translateY(-40px)}
  .hero{width:min(100%,360px);aspect-ratio:9/16;max-height:52vh;border-radius:20px;overflow:hidden;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .hero video{width:100%;height:100%;object-fit:cover;display:block}
  h1{font-size:28px;line-height:1.15;margin:0;text-align:center;font-weight:800;letter-spacing:-.01em}
  p.sub{margin:0;color:var(--muted);text-align:center;font-size:17px;max-width:32ch}
  .btn{appearance:none;border:0;background:var(--green);color:#fff;font-size:18px;font-weight:700;padding:16px 28px;border-radius:14px;cursor:pointer;min-height:52px;min-width:200px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--muted);font-weight:500;min-height:44px;padding:8px 16px}
  .counter{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><img src="assets/logo.jpg" alt="Do Favor. We do favors."></header>

<section class="step active" data-step="0">
  <div class="hero">
    <video src="assets/hero.mp4" autoplay muted loop playsinline></video>
  </div>
  <h1>Need a favor?</h1>
  <button class="btn" data-next>Get started</button>
</section>

<section class="step" data-step="1">
  <h1>Page two</h1>
  <p class="sub">This is where the first question goes. We'll fill it in together.</p>
  <button class="btn ghost" data-back>Back</button>
</section>

<div class="counter" id="counter"></div>

<script>
  const steps=[...document.querySelectorAll('.step')];
  let i=0;
  const counter=document.getElementById('counter');
  function show(n){
    if(n<0||n>=steps.length)return;
    const cur=steps[i];
    cur.classList.remove('active');cur.classList.add('leaving');
    setTimeout(()=>cur.classList.remove('leaving'),350);
    i=n;steps[i].classList.add('active');
    counter.textContent=`${i+1} / ${steps.length}`;
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-next]'))show(i+1);
    if(e.target.closest('[data-back]'))show(i-1);
  });
  counter.textContent=`1 / ${steps.length}`;
</script>
</body>
</html>
